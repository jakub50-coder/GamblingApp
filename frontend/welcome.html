<!-- this is the welcome page where you see your stats and settings-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Hub — Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">

    <!-- ── LEFT SIDEBAR ─────────────────────────────────── -->
    <aside class="sidebar">

        <div class="sidebar-logo">
            <span class="logo-icon">🎰</span>
            <div class="logo-text">Gaming Hub</div>
        </div>

        <div class="sidebar-profile">
            <div class="user-avatar" id="userAvatar">?</div>
            <div class="user-details">
                <div class="user-name" id="sidebarUsername">Loading...</div>
                <div class="user-role">Player</div>
            </div>
        </div>

        <div class="sidebar-coins">
            <div class="coins-label">Coins</div>
            <div class="coins-amount">
                🪙 <span id="sidebarCoins">—</span>
            </div>
            <div class="coins-refill" id="refillTimer"></div>
            <div class="coins-next" id="nextRefillLabel"></div>
        </div>

           <nav class="sidebar-nav">
            <div class="nav-label">Navigation</div>

            <button class="nav-btn active" id="navGames"
                    onclick="showSection('games')">
                <span class="nav-icon">🎮</span> Games
            </button>

            <button class="nav-btn" id="navSettings"
                    onclick="showSection('settings')">
                <span class="nav-icon">⚙️</span> Settings
            </button>

            <button class="nav-btn"
                    onclick="window.location.href='history.html'">
                <span class="nav-icon">📊</span> Transaction History
            </button>
        </nav>

        <div class="sidebar-footer">
            <button class="btn-logout" onclick="handleLogout()">
                🚪 Logout
            </button>
        </div>

    </aside>

    <main class="main-content">

    <!-- Games Section -->
    <div id="sectionGames">
        <div class="section-title">Games</div>
        <div class="section-subtitle">Choose a game to play</div>

        <div class="games-grid">

            <!-- Blackjack -->
            <div class="game-card" id="blackjackCard">
                <div class="game-card-image">🃏</div>
                <div class="game-card-body">
                    <div class="game-card-title">Blackjack</div>
                    <div class="game-card-desc">Beat the dealer to 21</div>
                    <button class="btn-play" id="blackjackBtn"
                            onclick="goToBlackjack()">
                        Play Now
                    </button>
                    <div class="game-locked-msg" id="blackjackLocked"></div>
                </div>
            </div>

            <!-- Coming soon placeholder -->
            <div class="game-card locked">
                <div class="game-card-image">🎲</div>
                <div class="game-card-body">
                    <div class="game-card-title">More Games</div>
                    <div class="game-card-desc">Coming soon</div>
                    <button class="btn-play" disabled>Coming Soon</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Settings Section — sibling of sectionGames, NOT inside it -->
    <div id="sectionSettings" style="display:none">
        <div class="section-title">Settings</div>
        <div class="section-subtitle">Customise your experience</div>

        <div class="settings-card">

            <!-- Theme -->
            <div class="settings-row">
                <div class="settings-info">
                    <div class="settings-label">Dark Mode</div>
                    <div class="settings-desc">
                        Switch between dark and light theme
                    </div>
                </div>
                <label class="toggle-wrap">
                    <input type="checkbox" id="themeToggle"
                           onchange="handleThemeToggle()">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <!-- Volume -->
            <div class="settings-row">
                <div class="settings-info">
                    <div class="settings-label">Volume</div>
                    <div class="settings-desc">
                        Sound effects volume (placeholder)
                    </div>
                </div>
                <div class="volume-wrap">
                    <input type="range" id="volumeSlider"
                           min="0" max="100" value="50"
                           oninput="handleVolumeChange()">
                    <span class="volume-label" id="volumeValue">50%</span>
                </div>
            </div>

        </div>
    </div>
    </main>
 </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const API_BASE = 'http://localhost:8080/api';

            console.log('Token:', localStorage.getItem('token'));
            //Makes sure that the user had to sign in
            if(!localStorage.getItem('token')) {
                window.location.href = 'login.html';
            }
            //function to make API requests
            async function apiRequest(endpoint, method = 'GET', body = null){
                const token = localStorage.getItem('token');
                const headers = {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                };

                const options = {method, headers};
                if(body){
                    options.body = JSON.stringify(body);
                }
                const response = await fetch(`${API_BASE}${endpoint}`, options);

                if(response.status === 401 || response.status === 403){
                    localStorage.clear();
                    window.location.href = 'login.html';
                    return null;
                }
                return response;
            }
            //calls the API /api/usser/me
            async function loadUserData(){
                const response = await apiRequest('/user/me');
                if(!response){
                    return;
                }

                const data = await response.json();

                document.getElementById('sidebarUsername').textContent = data.username;
                document.getElementById('userAvatar').textContent = data.username.charAt(0).toUpperCase();
                document.getElementById('sidebarCoins').textContent = data.coins.toLocaleString();

                localStorage.setItem('coins', data.coins);

                if(data.secondsUntilRefill && data.secondsUntilRefill > 0){
                    startRefillTimer(data.secondsUntilRefill);
                }

                if(data.coins < 10){
                    document.getElementById('blackjackBtn').disabled = true;
                    document.getElementById('blackjackLocked').textContent = 'You need to have at least 10 coins to play this game';
                }
            }
            //starts the refill time when the user can refill coins
            function startRefillTimer(seconds){
                const timerEl = document.getElementById('refillTimer');
                timerEl.style.display = 'block';

                function update(){
                    if(seconds <= 0){
                        timerEl.textContent = 'Refill ready - refresh!';
                        return;
                    }
                    const h = Math.floor(seconds / 3600);
                    const m = Math.floor((seconds % 3600) / 60);
                    const s = seconds % 60;
                    timerEl.textContent = `Refill in ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
                    seconds--;
                    setTimeout(update,1000);
                }
                update();
            }
            //changes sections
            function showSection(section){
                document.getElementById('sectionGames').style.display = section === 'games' ? 'block' : 'none';
                document.getElementById('sectionSettings').style.display = section === 'settings' ? 'block' : 'none';
                document.getElementById('navGames').classList.toggle('active', section === 'games');
                document.getElementById('navSettings').classList.toggle('active', section === 'settings');
            }
            //this is for light and dark mode in settings
            function handleThemeToggle() {
                const isDark = document.getElementById('themeToggle').checked;
                if(isDark){
                    document.body.classList.add('dark-mode');
                    document.body.classList.remove('light-mode');
                    localStorage.setItem('theme', 'dark');
                }
                else {
                    document.body.classList.remove('dark-mode');
                    document.body.classList.add('light-mode');
                    localStorage.setItem('theme', 'light');
                }
            }
            //deals with the volume change in settings
            function handleVolumeChange(){
                const value = document.getElementById('volumeSlider').value;
                document.getElementById('volumeValue').textContent = `${value}%`;
                localStorage.setItem('volume', value);
            }
            //goes to the blackjack game
            function goToBlackjack(){
                const coins = parseInt(localStorage.getItem('coins') || '0');
                if(coins < 10){
                    return;
                }
                window.location.href = 'blackjack.html';
            }
            //allows the user to logout
            function handleLogout(){
                localStorage.clear();
                window.location.href = 'login.html';
            }
            //save either light or dark mode
            const savedTheme = localStorage.getItem('theme') || 'light';
            if(savedTheme === 'dark'){
                document.body.classList.add('dark-mode');
                document.getElementById('themeToggle').checked = true;
            }
            else{
                document.body.classList.add('light-mode');
                document.getElementById('themeToggle').checked = false;
            }
            //save your volume preference
            const savedVolume = localStorage.getItem('volume') || '50';
            document.getElementById('volumeSlider').value = savedVolume;
            document.getElementById('volumeValue').textContent = `${savedVolume}%`;

            const urlParams = new URLSearchParams(window.location.search);
            const requestedSection = urlParams.get('section');
            if(requestedSection){
                showSection(requestedSection);
            }
            loadUserData();
        </script>
    </body>
</html>
