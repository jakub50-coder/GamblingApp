<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gaming Hub — Reset Password</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="login-page">
            <div class="login-header">
                <div class="site-name">Gaming website</div>
                <div class="site-tagline">Reset your password</div>
            </div>
            <div class="login-center">
                <div class="login-box">
                    <div class="box-title" style="text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 20px; color:var(--accent-gold)">Reset Password</div>
                    <!--When token is invalid-->
                    <div id="invalidState" style="display:none">
                        <div style="text-align:center; color:red; font-size:14px; margin-bottom:16px">This reset link has expired.</div>
                        <button class="btn-submit" onclick="window.location.href='login.html'">Back to Login</button>
                    </div>
                    <!--Reset form-->
                    <div id="resetForm">
                        <div class="form-group">
                            <label class="form-label">New Password</label>
                            <div class="password-wrap">
                                <input type="password" id="newPassword" class="form-input" placeholder="Enter new password">
                                <button class="password-toggle" type="button" onclick="togglePassword('newPassword', this)"></button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm New Password</label>
                        <div class="password-wrap">
                            <input type="password" id="confirmNewPassword" class="form-input" placeholder="Confirm new password">
                            <button class="password-toggle" type="button" onclick="togglePassword('confirmNewPassword', this)"></button>
                        </div>
                    </div>
                        <div class="form-error" id="resetError"></div>
                        <div id="resetSuccess" style="display:none; font-size: 13px; color: green; margin-bottom: 12px">Password reset successfully!</div>
                        <button class="btn-submit" onclick="handleReset()">Reset Password</button>
                    </div>
                </div>
            </div>
            <div class="login-footer">
                <p>Enjoy your gaming experience!</p>
            </div>
        </div>
        <script>
            const API_BASE = 'https://gamblingapp.onrender.com/api'; //'http://localhost:8080/api';
            
            // keep either dark or normal mode
            const savedTheme = localStorage.getItem('theme') || 'light';
            if(savedTheme === 'dark'){
                document.body.classList.add('dark-mode');
            }

            //get token from URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            //when there is no token in the URL
            if(!token){
                document.getElementById('resetForm').style.display = 'none';
                document.getElementById('invalidState').style.display = 'block';
            }

            //toggle password visibility
            function togglePassword(inputId, btn){
                const input = document.getElementById(inputId);
                if(input.type === 'password'){
                    input.type = 'text';
                    btn.textContent = '👁️';
                }
                else{
                    input.type = 'password';
                    btn.textContent = '👁️';
                }
            }
            //deals with the reset password process

            async function handleReset(){
                const newPassword = document.getElementById('newPassword').value;
                const confirm = document.getElementById('confirmNewPassword').value;
                const errorEl = document.getElementById('resetError');
                const successEl = document.getElementById('resetSuccess');
                errorEl.textContent = '';
                successEl.style.display = 'none';
                if(!newPassword || !confirm){
                    errorEl.textContent = 'Please fill in both fields.';
                    return;
                }
                if(newPassword != confirm){
                    errorEl.textContent = 'The passwords do not match.';
                    return;
                }
                if(newPassword.length < 14){
                    errorEl.textContent = 'Password must be at least 14 characters long.';
                    return;
                }
                try{
                    const response = await fetch(
                    `${API_BASE}/auth/reset-password`, 
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ token, newPassword })
                    }
                );
                    const data = await response.json();
                    if(response.ok){
                        successEl.style.display = 'block';
                        document.getElementById('resetForm').style.pointerEvents = 'none';
                        setTimeout(() => {
                            window.location.href = "login.html";
                        }, 2000);
                    }
                    else{
                        errorEl.textContent = data.message || 'Reset token. Request a new link.';
                        if(response.status === 400){
                            setTimeout(() => {
                                document.getElementById('resetForm').style.display = 'none';
                                document.getElementById('invalidState').style.display = 'block';
                            }, 2000);
                        }
                    }
                } catch(err){
                    errorEl.textContent = 'Could not connect to the server.';
                }
            }
        </script>
    </body>
</html>
