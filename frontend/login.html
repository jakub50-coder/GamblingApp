
<!-- This is the login page where you can either create a new account or log in to an existing account -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Page</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="login-page">

            <!-- Header — full width bar at the top -->
            <div class="login-header">
                <div class="site-name">Gaming Website</div>
                <div class="site-tagline">Your favorite games in one place</div>
            </div>

            <!-- Center — gold rimmed login box -->
            <div class="login-center">
                <div class="login-box">

                    <div class="auth-tabs">
                        <button class="auth-tab active" id="loginTab"
                            onclick="switchTab('login')">Login</button>
                        <button class="auth-tab" id="signupTab"
                            onclick="switchTab('signup')">Sign Up</button>
                    </div>

                    <!-- Login Form -->
                    <div id="loginForm">
                        <div class="form-group">
                            <label class="form-label">Username</label>
                            <input type="text" id="loginUsername" class="form-input"
                                   placeholder="Enter your username">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" id="loginPassword" class="form-input"
                                   placeholder="Enter your password">
                        </div>
                        <div class="form-error" id="loginError"></div>
                        <button class="btn-submit" onclick="handleLogin()">Login</button>
                    </div>

                    <!-- Signup Form -->
                    <div id="signupForm" style="display:none">
                        <div class="form-group">
                            <label class="form-label">Username</label>
                            <input type="text" id="signupUsername" class="form-input"
                                   placeholder="Choose a username">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" id="signupPassword" class="form-input"
                                   placeholder="Choose a password">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" id="signupConfirm" class="form-input"
                                   placeholder="Confirm your password">
                        </div>
                        <div class="form-error" id="signupError"></div>
                        <button class="btn-submit" onclick="handleSignup()">
                            Create Account
                        </button>
                    </div>

                </div>
            </div>

            <!-- Footer — full width bar at the bottom -->
            <div class="login-footer">
                <p>Enjoy your gaming experience!</p>
            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const API_BASE = 'http://localhost:8080/api';

            document.getElementById('signupForm').style.display = 'none';

            // When the user hasn't logged out of the page
            if (localStorage.getItem('token')) {
                window.location.href = 'welcome.html';
            }

            // Switches between the login and signup forms
            function switchTab(tab) {
                if (tab === 'login') {
                    document.getElementById('loginForm').style.display = 'block';
                    document.getElementById('signupForm').style.display = 'none';
                } else {
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('signupForm').style.display = 'block';
                }
            }

            // Gets the login information and sends it to the server
            async function handleLogin() {
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value;
                const errorEl = document.getElementById('loginError');

                errorEl.textContent = '';

                if (!username || !password) {
                    errorEl.textContent = 'Please enter both username and password.';
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        if (data.token) localStorage.setItem('token', data.token);
                        if (data.username) localStorage.setItem('username', data.username);
                        if (data.coins !== undefined) localStorage.setItem('coins', data.coins);
                        window.location.href = 'welcome.html';
                    } else {
                        errorEl.textContent = data.message || 'Login failed.';
                    }
                } catch (err) {
                    errorEl.textContent = 'Could not connect to the server.';
                }
            }

            // Handles signup and auto-login after account creation
            async function handleSignup() {
                const username = document.getElementById('signupUsername').value.trim();
                const password = document.getElementById('signupPassword').value;
                const confirm = document.getElementById('signupConfirm').value;
                const errorEl = document.getElementById('signupError');

                errorEl.textContent = '';

                // Makes sure all fields are filled out
                if (!username || !password || !confirm) {
                    errorEl.textContent = 'Please fill in all fields.';
                    return;
                }

                // Makes sure that both passwords match
                if (password !== confirm) {
                    errorEl.textContent = 'Passwords do not match.';
                    return;
                }

                try {
                    // Step 1 — create the account
                    const signupResponse = await fetch(`${API_BASE}/auth/signup`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const signupData = await signupResponse.json();

                    if (!signupResponse.ok) {
                        errorEl.textContent = signupData.message || 'Signup failed.';
                        return;
                    }

                    // Step 2 — auto login after signup
                    const loginResponse = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const loginData = await loginResponse.json();

                    if (loginResponse.ok) {
                        localStorage.setItem('token', loginData.token);
                        localStorage.setItem('username', loginData.username);
                        localStorage.setItem('coins', loginData.coins);
                        window.location.href = 'welcome.html';
                    } else {
                        errorEl.textContent = 'Account created! Please log in.';
                        switchTab('login');
                        document.getElementById('loginUsername').value = username;
                    }

                } catch (err) {
                    errorEl.textContent = 'Could not connect to the server.';
                }
            }

            // User can press Enter instead of clicking the button
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const loginVisible =
                        document.getElementById('loginForm').style.display !== 'none';
                    if (loginVisible) handleLogin();
                    else handleSignup();
                }
            });
        </script>
    </body>
</html>
