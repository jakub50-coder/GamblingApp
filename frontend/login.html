
<!-- This is the login page where you can either create a new account or log in to an existing account -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Page</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="login-page">

            <!-- Header — full width bar at the top -->
            <div class="login-header">
                <div class="site-name">Gaming Website</div>
                <div class="site-tagline">Your favorite games in one place</div>
            </div>

            <!-- Center — gold rimmed login box -->
            <div class="login-center">
                <div class="login-box">

                    <div class="auth-tabs">
                        <button class="auth-tab active" id="loginTab"
                            onclick="switchTab('login')">Login</button>
                        <button class="auth-tab" id="signupTab"
                            onclick="switchTab('signup')">Sign Up</button>
                    </div>

                    <!-- Login Form -->
                    <div id="loginForm">
                        <div class="form-group">
                            <label class="form-label">Username</label>
                            <input type="text" id="loginUsername" class="form-input"
                                   placeholder="Enter your username">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <div class="password-wrap">
                                <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password">
                                <button class="password-toggle" type="button" onclick="togglePassword('loginPassword', this)">👁️</button>
                            </div>
                        </div>
                        <div class="form-error" id="loginError"></div>
                        <button class="btn-submit" onclick="handleLogin()">Login</button>
                        <div class="forgot-link">
                            <span onclick="openForgotModel()">Forgot password?</span>
                        </div>
                    </div>

                    <!-- Signup Form -->
                    <div id="signupForm" style="display:none">
                        <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type ="email" id="signupEmail" class="form-input" placeholder="Enter your email">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Username</label>
                            <input type="text" id="signupUsername" class="form-input"
                                   placeholder="Choose a username">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <div class="password-wrap">
                                <input type="password" id="signupPassword" class="form-input" placeholder="Enter a password">
                                <button class="password-toggle" type="button" onclick="togglePassword('signupPassword', this)">👁️</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Confirm Password</label>
                            <div class="password-wrap">
                                <input type="password" id="signupConfirm" class="form-input"placeholder="Confirm your password">
                                <button class="password-toggle" type="button" onclick="togglePassword('signupConfirm', this)">👁️</button>
                            </div>
                        </div>
                        <div class="form-error" id="signupError"></div>
                        <button class="btn-submit" onclick="handleSignup()">
                            Create Account
                        </button>
                    </div>
                </div>
            </div>

            <!-- Footer — full width bar at the bottom -->
            <div class="login-footer">
                <p>Enjoy your gaming experience!</p>
            </div>

        </div>
        <!--Forgot password-->
        <div id="forgotModel" style="display:none">
            <div id="forgotOverlay" onclick="closeForgotModel()"></div>
            <div id="forgotBox">
                <div id="forgotTitle">Forgot Passwords</div>
                <div id="forgotMessage">Enter your email and we will help you reset your password</div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="forgotUsername" class="form-input" placeholder="Enter your email">
                </div>
                <div class="form-error" id="forgotError"></div>
                <div class="form-success" id="forgotSuccess" style="display:none"> If the email exists, a reset link will be sent.</div>
                <div id="forgotButtons">
                    <button id="forgotCancel" onclick="closeForgotModel()">Cancel</button>
                    <button id="forgotSubmit" onclick="handleForgotPassword()">Submit</button>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const API_BASE = 'http://localhost:8080/api';

            document.getElementById('signupForm').style.display = 'none';

            // When the user hasn't logged out of the page
            if (localStorage.getItem('token')) {
                window.location.href = 'welcome.html';
            }

            // Switches between the login and signup forms
            function switchTab(tab) {
                if (tab === 'login') {
                    document.getElementById('loginForm').style.display = 'block';
                    document.getElementById('signupForm').style.display = 'none';
                } 
                else {
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('signupForm').style.display = 'block';
                }
            }
            //show or hide password
            function togglePassword(inputId, btn){
                const input = document.getElementById(inputId);
                if (input.type === 'password') {
                    input.type = 'text';
                } 
                else {
                    input.type = 'password';
                }
            }

            //Opens the forgot password model
            function openForgotModel(){
                document.getElementById('forgotUsername').value ='';
                document.getElementById('forgotError').textContent = '';
                document.getElementById('forgotSuccess').style.display = 'none';
                document.getElementById('forgotModel').style.display ='flex';
            }

            //Closes the forgot password mode
            function closeForgotModel(){
                document.getElementById('forgotModel').style.display = 'none';
            }

            //handles forgot password submission
            function handleForgotPassword(){
                const email = document.getElementById('forgotUsername').value.trim();
                const errorEl = document.getElementById('forgotError');
                const successEl = document.getElementById('forgotSuccess');

                errorEl.textContent = '';
                successEl.style.display = 'none';

                if(!email){
                    showError('forgotError', 'Please enter your email address.');
                    return;
                }

                if(!email.includes('@')){
                    showError('forgotError', 'Please enter a valid email address.');
                    return;
                }
                fetch(`${API_BASE}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                })
                .then(async res => {
                    let data = {};
                    try {
                        data = await res.json();
                    } catch (e) {
                        data = {};
                    }

                    if (res.ok) {
                        successEl.style.display = 'flex';
                        setTimeout(() => {
                            closeForgotModel();
                        }, 3000);
                    } else {
                        showError('forgotError', data.message || 'Could not send the password reset email.');
                    }
                })
                .catch(() => {
                    showError('forgotError', 'Could not connect to the server.');
                });
            }
            // Gets the login information and sends it to the server
            async function handleLogin() {
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value;
                const errorEl = document.getElementById('loginError');

                errorEl.textContent = '';

                if (!username || !password) {
                    errorEl.textContent = 'Please enter both username and password.';
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        if (data.token) localStorage.setItem('token', data.token);
                        if (data.username) localStorage.setItem('username', data.username);
                        if (data.coins !== undefined) localStorage.setItem('coins', data.coins);
                        window.location.href = 'welcome.html';
                    } else {
                        errorEl.textContent = data.message || 'Login failed.';
                    }
                } catch (err) {
                    errorEl.textContent = 'Could not connect to the server.';
                }
            }

            //Shows a specific error message
            function showError(id, message){
                const el = document.getElementById(id);
                el.textContent = message;
            }

            function clearError(id){
                const el = document.getElementById(id);
                el.textContent = '';
            }

            // Handles signup and auto-login after account creation
            async function handleSignup() {
                const email = document.getElementById('signupEmail').value.trim();
                const username = document.getElementById('signupUsername').value.trim();
                const password = document.getElementById('signupPassword').value;
                const confirm = document.getElementById('signupConfirm').value;
                const errorEl = document.getElementById('signupError');

                errorEl.textContent = '';

                // Makes sure all fields are filled out
                if (!username || !password || !confirm) {
                    errorEl.textContent = 'Please fill in all fields.';
                    return;
                }
                //checks to see if email is good
                if(!email || !email.includes('@')){
                    showError('signupError', 'Please enter a valid email.');
                    return;
                }

                // Makes sure that both passwords match
                if (password !== confirm) {
                    errorEl.textContent = 'Passwords do not match.';
                    return;
                }

                try {
                    // Step 1 — create the account
                    const signupResponse = await fetch(`${API_BASE}/auth/signup`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({email,username, password })
                    });

                    const signupData = await signupResponse.json();

                    if (!signupResponse.ok) {
                        errorEl.textContent = signupData.message || 'Signup failed.';
                        return;
                    }

                    // Step 2 — auto login after signup
                    const loginResponse = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, username, password })
                    });

                    const loginData = await loginResponse.json();

                    if (loginResponse.ok) {
                        localStorage.setItem('token', loginData.token);
                        localStorage.setItem('username', loginData.username);
                        localStorage.setItem('coins', loginData.coins);
                        window.location.href = 'welcome.html';
                    } else {
                        errorEl.textContent = 'Account created! Please log in.';
                        switchTab('login');
                        document.getElementById('loginUsername').value = username;
                    }

                } catch (err) {
                    errorEl.textContent = 'Could not connect to the server.';
                }
            }

            // User can press Enter instead of clicking the button
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const loginVisible =
                        document.getElementById('loginForm').style.display !== 'none';
                    if (loginVisible) handleLogin();
                    else handleSignup();
                }
            });
        </script>
    </body>
</html>
