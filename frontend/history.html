<!--This is the hisotry page where it shows the last 7 days of the user activity in terms of coin transactions-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Hub — History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">

    <!-- ── LEFT SIDEBAR ─────────────────────────────────── -->
    <aside class="sidebar">

        <div class="sidebar-logo">
            <span class="logo-icon">🎰</span>
            <div class="logo-text">Gaming Hub</div>
        </div>

        <div class="sidebar-profile">
            <div class="user-avatar" id="userAvatar">?</div>
            <div class="user-details">
                <div class="user-name" id="sidebarUsername">Loading...</div>
                <div class="user-role">Player</div>
            </div>
        </div>

        <div class="sidebar-coins">
            <div class="coins-label">Coins</div>
            <div class="coins-amount">
                🪙 <span id="sidebarCoins">—</span>
            </div>
            <div class="coins-refill" id="refillTimer"></div>
        </div>


        <nav class="sidebar-nav">
            <div class="nav-label">Navigation</div>

            <button class="nav-btn"
                    onclick="window.location.href='welcome.html'">
                <span class="nav-icon">🎮</span> Games
            </button>

            <button class="nav-btn"
                    onclick="window.location.href='welcome.html?section=settings'">
                <span class="nav-icon">⚙️</span> Settings
            </button>

            <button class="nav-btn active">
                <span class="nav-icon">📊</span> Transaction History
            </button>
        </nav>

        <div class="sidebar-footer">
            <button class="btn-logout" onclick="handleLogout()">
                🚪 Logout
            </button>
        </div>

    </aside>
    <!-- ── MAIN CONTENT ──────────────────────────────────── -->
    <main class="main-content with-right-panel">

        <div class="history-header">Transaction History</div>

        <!-- Transaction list -->
        <div class="transaction-card" id="transactionCard">
            <div class="no-transactions" id="loadingMsg">
                Loading transactions...
            </div>
        </div>
    </main>

    <aside class="right-panel">

        <!-- Top half — overall stats -->
        <div class="right-panel-section">
            <div class="right-panel-title">Overall (filtered)</div>

            <div class="stat-item">
                <span class="stat-name">🪙 Coins Won</span>
                <span class="stat-val positive" id="statWon">—</span>
            </div>
            <div class="stat-item">
                <span class="stat-name">🎰 Coins Bet</span>
                <span class="stat-val negative" id="statBet">—</span>
            </div>
            <div class="stat-item">
                <span class="stat-name">❌ Coins Lost</span>
                <span class="stat-val negative" id="statLost">—</span>
            </div>
            <div class="stat-item">
                <span class="stat-name">🔄 Coins Refilled</span>
                <span class="stat-val gold" id="statRefilled">—</span>
            </div>
            <div class="stat-item">
                <span class="stat-name">📈 Net Coins</span>
                <span class="stat-val" id="statNet">—</span>
            </div>
        </div>

        <!-- Bottom half — filters -->
        <div class="right-panel-section">
            <div class="right-panel-title">Filters</div>

            <div class="filter-group">
                <label class="filter-label">Time Period</label>
                <select class="filter-select" id="filterDays"
                        onchange="applyFilters()">
                    <option value="7">Last 7 days</option>
                    <option value="14">Last 14 days</option>
                    <option value="30">Last 30 days</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Transaction Type</label>
                <select class="filter-select" id="filterType"
                        onchange="applyFilters()">
                    <option value="all">All Transactions</option>
                    <option value="WIN">Wins Only</option>
                    <option value="BET">Bets Only</option>
                    <option value="REFILL">Refills Only</option>
                </select>
            </div>
        </div>
    </aside>
</div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const API_BASE = 'http://localhost:8080/api';

            if(!localStorage.getItem('token')){
                window.location.href = 'login.html';
            }
            //used to call api's
            async function apiRequest(endpoint, method = 'GET', body = null) {
                const token = localStorage.getItem('token');
                const headers = {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                };
                const options = { method, headers };
                if (body) {
                    options.body = JSON.stringify(body);
                }
                const response = await fetch(`${API_BASE}${endpoint}`, options);

                if(response.status === 401 || response.status === 403){
                    localStorage.clear();
                    window.location.href = 'login.html';
                    return null;
                }
                return response;
            }
            //calls /api/user/transactions and fills in all the information
            async function loadUserData(){
                const response = await apiRequest('/user/me');
                if(!response){
                    return;
                }
                const data = await response.json();
                document.getElementById('sidebarUsername').textContent = data.username;
                document.getElementById('userAvatar').textContent = data.username.charAt(0).toUpperCase();
                document.getElementById('sidebarCoins').textContent = data.coins.toLocaleString();
            }

            async function loadTransactions(){
                const response = await apiRequest('/user/transactions');
                if(!response){
                    return;
                }
                const data = await response.json();

                document.getElementById('statWon').textContent = `+${data.totalWon}`;
                document.getElementById('statBet').textContent = `${data.totalBet}`;
                document.getElementById('statRefilled').textContent = `${data.totalRefilled}`;

                const net = data.netResult;
                document.getElementById('statNet').textContent = net >= 0 ? `+${net}` : `${net}`;

                const listEl = document.getElementById('transactionList');
                document.getElementById('loadingMsg').style.display = 'none';

                if (!data.transactions || data.transactions.length === 0) {
                    listEl.innerHTML = '<p>No transactions in the last 7 days.</p>';
                    return;
                }

                data.transactions.forEach(t => {
                    const item = document.createElement('div');
                    const icon = t.type === 'WIN' ? '✅' :
                                 t.type === 'BET' ? '🎰' : '🔄';
                    const amountText = t.amount >= 0 ? `+${t.amount}` : `${t.amount}`;
                    const date = new Date(t.createdAt);
                    const dateStr = `${date.toLocaleDateString()} ${date.toLocaleTimeString()}`;

                    item.innerHTML =
                        `<span>${icon}</span>
                        <div>
                            <div>${t.type}</div>
                            <div>${t.game ? t.game : 'System'} · ${dateStr}</div>
                        </div>
                        <div>${amountText} coins</div>`;

                    listEl.appendChild(item);
                });
            }
            //for the dark mode
            function applyTheme(){
                const savedTheme = localStorage.getItem('theme') || 'default';
                document.body.classList.remove('dark-mode', 'light-mode');

                if(savedTheme === 'dark'){
                    document.body.classList.add('dark-mode');
                }
                else if(savedTheme === 'light'){
                    document.body.classList.add('light-mode');
                }
            }
            //handles logout
            function handleLogout(){
                localStorage.clear();
                window.location.href = 'login.html';
            }

            if(localStorage.getItem('theme') === 'light'){
                document.body.classList.add('light-mode');
            }
            loadUserData();
            loadTransactions();
            applyTheme();
        </script>
    </body>
</html>
